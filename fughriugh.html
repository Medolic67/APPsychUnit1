<header><div class="hl"><div class="logo"><i class="fa-solid fa-brain"></i></div><div><h1>NeuroMaster <span class="pro">Unit 1</span></h1><div class="mu">AP Psychology Study Suite</div></div></div><div class="stats" id="cnt"></div><nav id="modes"></nav></header>
<div id="rt"><details open class="card" id="flt"><summary><i class="fa-solid fa-sliders"></i> Filters: scope and categories</summary><div class="bar" id="scope"></div><div class="bar" id="cats"></div></details><main id="main"></main></div>
<script>
const C={G:"Genetics",N:"Nervous system",U:"Neuron",C:"Neurotransmitters & hormones",D:"Drugs",M:"Brain methods",S:"Brain structures",X:"Cortex"};
const D=[
["Psychology","G","Scientific study of behavior and mental processes."],
["Nature-nurture issue","G","Debate over how much genes (nature) vs. experience (nurture) shape us; both interact."],
["Natural selection","G","Inherited traits that aid survival and reproduction become more common over generations."],
["Evolutionary psychology","G","Studies how natural selection shaped behavior and mind to solve ancestral problems."],
["Mutation","G","Random error in gene replication; source of variation for natural selection."],
["Environment","G","Every nongenetic influence, from prenatal nutrition to culture."],
["Heredity","G","Genetic transfer of characteristics from parents to offspring."],
["Genes","G","DNA segments that code for proteins; biochemical units of heredity."],
["Identical (monozygotic) twins","G","Twins from one fertilized egg that splits; share 100% of genes."],
["Fraternal (dizygotic) twins","G","Twins from two separate eggs; share about 50% of genes."],
["Interaction","G","Effect of one factor (e.g. genes) depends on another (e.g. environment)."],
["Nervous system","N","Body's electrochemical communication network of all neurons."],
["Central nervous system (CNS)","N","Brain and spinal cord; makes decisions and processes information."],
["Peripheral nervous system (PNS)","N","Sensory and motor neurons connecting the CNS to the body."],
["Nerves","N","Bundles of axons forming cables between CNS and muscles, glands, sense organs."],
["Sensory (afferent) neurons","N","Carry incoming information from receptors to brain and spinal cord."],
["Motor (efferent) neurons","N","Carry outgoing commands from CNS to muscles and glands."],
["Interneurons","N","Neurons within CNS linking sensory input to motor output; most numerous type."],
["Somatic nervous system","N","PNS division controlling voluntary skeletal muscle movement."],
["Autonomic nervous system","N","PNS division controlling glands and internal organs automatically."],
["Sympathetic nervous system","N","Arouses body, mobilizes energy under stress (fight or flight)."],
["Parasympathetic nervous system","N","Calms body, conserves energy (rest and digest)."],
["Reflex","N","Simple automatic inborn response to a stimulus, handled by the spinal cord."],
["Neuron","U","Nerve cell; basic building block of the nervous system."],
["Glial cells","U","Support cells that nourish, insulate (myelin), and clean up around neurons."],
["Action potential","U","Brief electrical charge traveling down an axon as positive ions rush in."],
["Threshold","U","Level of stimulation needed to trigger a neural impulse."],
["Refractory period","U","Brief rest after firing during which a neuron cannot fire again."],
["All-or-none response","U","A neuron fires completely or not at all; strength is constant, rate can vary."],
["Neurotransmitters","C","Chemical messengers crossing the synapse to excite or inhibit the next neuron.","Made in neuron cell bodies and stored in vesicles at the axon terminals.|Released when an action potential reaches the terminal, they cross the synapse and bind receptors like a key in a lock, exciting or inhibiting the next neuron. They are then cleared by reuptake or enzymes.|Carry messages between neurons and to muscles and glands, shaping movement, mood, memory, sleep, and arousal.|Too much or too little of a specific transmitter is tied to disorders such as Parkinson's, depression, and schizophrenia.|Drugs act as agonists (mimic), antagonists (block), or reuptake blockers."],
["Reuptake","C","Sending neuron reabsorbs leftover neurotransmitter; blocked by many antidepressants."],
["Endorphins","C","Natural opiate-like neurotransmitters for pain control and pleasure.","Released by the pituitary gland and hypothalamus during pain, stress, vigorous exercise, and laughter.|Bind opioid receptors, which blocks pain signals and triggers dopamine release.|Natural pain relief, pleasure, well-being, and the 'runner's high'.|Low levels mean heightened pain sensitivity. Opioid drug use shuts down natural production, so stopping causes painful withdrawal.|The name means 'morphine within'. Heroin, morphine, and oxycodone are agonists of these receptors."],
["Agonist","C","Molecule that mimics or enhances a neurotransmitter's effect (antagonist blocks it).","Not made by the body; a drug or toxin molecule.|Shaped like a neurotransmitter, so it fits the receptor and activates it, imitating or enhancing the natural effect.|Boosts or copies the message of a neurotransmitter (morphine at endorphin receptors, nicotine at ACh receptors).|Overuse changes receptors and causes tolerance, dependence, and withdrawal.|Antagonists do the opposite by blocking receptors (curare, antipsychotics)."],
["Endocrine system","C","Slower chemical system of glands secreting hormones into the bloodstream.","Glands: pituitary, thyroid, parathyroids, adrenals, pancreas, ovaries or testes, and pineal.|Glands release hormones into the bloodstream, which carries them to distant target cells.|Slow, widespread control of growth, metabolism, stress, reproduction, hunger, and sleep.|Gland overactivity or underactivity causes disorders such as diabetes and thyroid disease.|The pituitary is the 'master gland', and the hypothalamus controls it, linking nervous and endocrine systems."],
["Hormones","C","Chemical messengers carried by blood that affect other tissues.","Made by endocrine glands (pituitary, adrenals, pancreas, thyroid, ovaries, testes) and the hypothalamus.|Travel through the blood and bind receptors on target cells. Slower than neurotransmitters but effects last longer.|Regulate growth, metabolism, stress response, hunger, sleep, and sexual development.|Examples: diabetes (insulin), thyroid disorders, effects of chronic stress (cortisol, adrenaline).|Some chemicals act as both hormone and neurotransmitter (norepinephrine)."],
["Dopamine","C","Neurotransmitter for reward, movement, and attention.","Made in the midbrain (substantia nigra and ventral tegmental area); acts in reward and movement circuits.|Binds dopamine receptors and is cleared by reuptake; effect depends on the receptor type.|Reward, motivation, pleasure, voluntary movement, attention, and learning from rewards.|Too little: Parkinson's disease (tremors, slow movement). Too much: schizophrenia symptoms such as hallucinations and delusions.|Cocaine and amphetamines raise it; antipsychotics block its receptors; L-dopa treats Parkinson's. Addictive drugs flood the reward pathway."],
["Serotonin","C","Neurotransmitter affecting mood, hunger, sleep, and arousal.","Made in the brainstem raphe nuclei; most of the body's supply is actually in the gut.|Binds many receptor types and is cleared by reuptake, which SSRIs block.|Mood regulation, sleep, appetite, arousal, impulse control, and body temperature.|Low: depression, anxiety, OCD, aggression. Excess: serotonin syndrome (fever, agitation, tremor).|SSRIs (Prozac, Zoloft) raise it; LSD and psilocybin act on its receptors; MDMA releases it."],
["Acetylcholine (ACh)","C","Neurotransmitter for muscle action, learning, and memory.","Released by motor neurons at the neuromuscular junction and by neurons in the basal forebrain.|Binds receptors on muscle fibers to trigger contraction; in the brain it supports attention and memory circuits. An enzyme breaks it down.|All voluntary muscle contraction, learning, memory, attention, REM sleep, and parasympathetic organ control.|Too little: Alzheimer's (memory loss) and muscle weakness. Too much: spasms.|Curare and botulism toxin block it (paralysis), black widow venom floods it, and nicotine mimics it."],
["GABA","C","Major inhibitory neurotransmitter.","Made by interneurons throughout the brain and spinal cord; the main inhibitory neurotransmitter.|Opens chloride channels so the next neuron is less likely to fire.|Calms neural activity, reduces anxiety, promotes sleep, and balances excitation from glutamate.|Too little: anxiety, seizures, tremors. Too much: sedation and slowed breathing.|Alcohol, barbiturates, and benzodiazepines boost GABA, causing drowsiness and slurred speech."],
["Glutamate","C","Major excitatory neurotransmitter involved in learning and memory.","The most common excitatory transmitter; used by most cortex and hippocampus neurons.|Binds receptors (including NMDA) that let ions in, making firing more likely.|Learning and memory through long-term potentiation, sensory processing, and general brain activation.|Too much: overexcitation, seizures, migraines, and neuron death after stroke.|Counterpart to GABA. MSG can overstimulate; ketamine and PCP block NMDA receptors."],
["Norepinephrine","C","Neurotransmitter and hormone that increases arousal and alertness.","Made in the locus coeruleus of the brainstem and at sympathetic nerve endings; also released by adrenal glands.|Binds adrenergic receptors during sympathetic activation and is cleared by reuptake.|Arousal, alertness, attention, raising heart rate and blood pressure, and memory of emotional events.|Too little: depression, low energy, poor focus. Too much: anxiety, panic, high blood pressure.|Amphetamines and cocaine raise it; SNRIs block its reuptake. A close relative of epinephrine."],
["Epinephrine (adrenaline)","C","Hormone from adrenal glands that triggers fight or flight.","Made by the adrenal medulla, on top of the kidneys, when the sympathetic nervous system fires.|Released into the blood; binds receptors on the heart, lungs, liver, and muscles.|Fight or flight: raises heart rate, blood pressure, and blood sugar, widens airways, and slows digestion.|Chronic excess: hypertension, anxiety, and exhaustion.|EpiPens deliver it to stop severe allergic reactions. Norepinephrine is its close relative."],
["Insulin","C","Pancreatic hormone that lowers blood glucose.","Made by beta cells of the pancreas.|Tells cells to take up glucose from the blood; the liver stores excess as glycogen.|Lowers blood sugar, stores energy, and influences hunger.|Type 1: no insulin made. Type 2: cells resist it. Too much: low blood sugar, shakiness, hunger.|Works opposite glucagon, which raises blood sugar."],
["Leptin","C","Hormone from fat cells that signals fullness.","Made by fat cells.|Travels to the hypothalamus to signal that energy stores are sufficient.|Suppresses appetite and increases energy use.|Leptin resistance leads to constant hunger and weight gain; low leptin from dieting increases hunger.|Leptin turns appetite down; ghrelin turns it up."],
["Ghrelin","C","Stomach hormone that signals hunger.","Made by the stomach lining.|Travels to the hypothalamus, stimulating hunger centers.|Triggers hunger and food seeking, rising before meals.|Rises with dieting and poor sleep, making weight loss harder.|Mnemonic: ghrelin makes your stomach growl."],
["Oxytocin","C","Hormone for bonding, birth, and nursing.","Made in the hypothalamus and released by the pituitary gland.|Acts on the uterus, breasts, and brain; released with touch, birth, and nursing.|Bonding, trust, labor contractions, milk release, and attachment.|Can increase in-group bias and envy; low levels are linked to social difficulties in some research.|Called the 'cuddle hormone'; a synthetic form is used to induce labor."],
["Melatonin","C","Pineal hormone that regulates sleep-wake cycle.","Made by the pineal gland in the brain.|Released in darkness, controlled by the brain's biological clock; light suppresses it.|Regulates the sleep-wake cycle and promotes drowsiness.|Light at night, jet lag, and shift work disrupt it and cause insomnia.|Supplements are used for jet lag. Teens release it later, explaining late sleep schedules."],
["Psychoactive drugs","D","Chemicals that change perception and mood by altering neural activity.","Alter neurotransmitter release, receptors, or reuptake.|Change mood, perception, arousal.|Tolerance, dependence, withdrawal."],
["Depressants","D","Drugs that slow neural activity and body functions (alcohol, barbiturates, tranquilizers).","Boost GABA and slow neural firing.|Relaxation, lowered inhibition, drowsiness.|Slurred speech, impaired memory and judgment, blackouts, respiratory failure; dangerous mixed together. Alcohol: aggression, liver damage."],
["Tolerance","D","Diminishing effect of the same dose; larger doses needed."],
["Addiction","D","Compulsive drug craving and use despite harmful consequences."],
["Withdrawal","D","Discomfort and distress after stopping an addictive drug."],
["Opioids","D","Opium derivatives (morphine, heroin, oxycodone) that depress neural activity and relieve pain.","Mimic endorphins at opioid receptors; brain reduces its own endorphins.|Pain relief, euphoria, calm.|Constipation, drowsiness, slowed breathing and fatal overdose, severe withdrawal, high addiction risk."],
["Stimulants","D","Drugs that excite neural activity and speed body functions (caffeine, nicotine, cocaine, amphetamines, meth).","Increase dopamine/norepinephrine (cocaine blocks reuptake; amphetamines boost release).|Energy, alertness, euphoria, reduced appetite.|Anxiety, insomnia, high blood pressure, heart problems; crash, depression, paranoia, addiction. Nicotine: highly addictive, cancer risk."],
["Hallucinogens","D","Psychedelics (LSD, psilocybin, marijuana in some systems) that distort perception without sensory input.","LSD and psilocybin act on serotonin receptors; THC binds cannabinoid receptors.|Altered perception, vivid imagery, mood shifts, relaxation (THC).|Panic, paranoia, flashbacks; THC: impaired memory and coordination, possible respiratory harm."],
["Biological psychology","M","Branch studying links between biology and behavior."],
["Biopsychosocial approach","M","Integrates biological, psychological, and social-cultural influences."],
["Lesion","M","Tissue destruction, natural or deliberate, to study a brain region."],
["EEG (electroencephalogram)","M","Records brain wave electrical activity via scalp electrodes."],
["MEG (magnetoencephalography)","M","Measures magnetic fields from brain activity with fast timing."],
["CT (computed tomography) scan","M","X-rays from many angles combined into a picture of brain structure."],
["PET (positron emission tomography)","M","Shows brain activity by tracking radioactive glucose use."],
["MRI (magnetic resonance imaging)","M","Magnetic fields and radio waves give detailed images of brain structure."],
["fMRI (functional MRI)","M","Shows blood flow, so both brain structure and function."],
["Brainstem","S","Oldest, innermost brain part; automatic survival functions."],
["Medulla","S","Base of brainstem controlling heartbeat and breathing."],
["Thalamus","S","Sensory switchboard routing messages to cortex (except smell)."],
["Reticular formation","S","Brainstem network controlling arousal and alertness (RAS)."],
["Cerebellum","S","Coordinates movement and balance; helps nonverbal learning and memory."],
["Limbic system","S","Structures tied to emotion and drives: amygdala, hypothalamus, hippocampus."],
["Amygdala","S","Almond-shaped clusters linked to fear and aggression."],
["Hypothalamus","S","Directs eating, drinking, temperature; controls pituitary; linked to emotion and reward."],
["Pituitary gland","S","The endocrine system's master gland beneath the hypothalamus; releases hormones (growth hormone, oxytocin) that regulate other glands."],
["Hippocampus","S","Processes and forms new explicit (conscious) memories."],
["Broca's area","X","Left frontal lobe area controlling speech production (forming words); damage causes Broca's aphasia."],
["Wernicke's area","X","Left temporal lobe area for language comprehension; damage causes Wernicke's aphasia."],
["Cerebral cortex","X","Fabric of neural cells covering the hemispheres; ultimate control center."],
["Frontal lobes","X","Behind forehead: speaking, movement, planning, judgment."],
["Parietal lobes","X","Top rear of head: touch and body position input."],
["Occipital lobes","X","Back of head: visual areas."],
["Temporal lobes","X","Above the ears: auditory areas."],
["Motor cortex","X","Rear of frontal lobes; controls voluntary movement."],
["Somatosensory cortex","X","Front of parietal lobes; registers touch and movement sensations."],
["Association areas","X","Cortex areas that integrate information for learning, thinking, speaking."],
["Corpus callosum","X","Band of fibers connecting the two hemispheres."],
["Split brain","X","Result of cutting the corpus callosum, separating hemispheres."]
];
const $=id=>document.getElementById(id),sh=a=>{a=[...a];for(let i=a.length;i>1;){let j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let mode="flash",scope="all",cats=new Set(Object.keys(C)),miss=new Set(),miss_only=false;
const MODES={gloss:"Glossary",browse:"Detail Notes",methods:"Brain Methods",brain:"Brain Map",neuron:"Neuron Lab",flash:"Flashcards",match:"Matching",quiz:"Quiz",func:"Function Match",type:"Type-In",rev:"Definitions",app:"Applications",aaq:"AAQ Practice"};
const IC={gloss:"book-open",browse:"list",methods:"microscope",brain:"brain",neuron:"bolt",flash:"clone",match:"puzzle-piece",quiz:"list-check",func:"bullseye",type:"keyboard",rev:"arrows-left-right",app:"flask",aaq:"file-pen"};
function pool(n){let p=sh(D.filter(d=>cats.has(d[1])&&(!miss_only||miss.has(d[0]))));return scope=="rand"?p.slice(0,n):p}
function det(d){if(!d[3])return"";const a=d[3].split("|"),L=a.length>3?["Where it comes from","How it works","Main functions","When imbalanced","Drugs and exam tips"]:["How it works","Main effects","Side effects"];return'<div class="det">'+a.map((x,i)=>`<div><b>${L[i]}:</b> ${x}</div>`).join("")+"</div>"}
function bar(){
$("modes").innerHTML=Object.keys(MODES).map(k=>`<button class="tab ${k==mode?"on":""}" onclick="mode='${k}';go()"><i class="fa-solid fa-${IC[k]}"></i> ${MODES[k]}</button>`).join("");
$("scope").innerHTML=[["rand","Random 10"],["all","Everything, random order"]].map(([k,v])=>`<button class="${k==scope?"on":""}" onclick="scope='${k}';go()">${v}</button>`).join("")+`<button class="${miss_only?"on":""}" onclick="miss_only=!miss_only;go()">Missed only (${miss.size})</button>`;

const p=$("ap"),L=p.getTotalLength()*.54,g=$("gd"),m=$("imp"),t0=performance.now();m.setAttribute("opacity",1);
(function f(t){const k=Math.min(1,(t-t0)/2600),q=p.getPointAtLength(k*L);g.setAttribute("cx",q.x);g.setAttribute("cy",q.y);m.setAttribute("cx",190+k*400);ps(q.x<150?0:q.x<200?2:q.x<240?3:4);
if(k<1)requestAnimationFrame(f);else{m.setAttribute("opacity",0);$("pi").innerHTML="<b>Done:</b> the impulse traveled the axon. A stronger stimulus makes the neuron fire more often, not with a bigger spike (all-or-none)."}})(t0)}
function rel(){const s=$("sy"),d=$("dr").value;s.querySelectorAll(".nt").forEach(e=>e.remove());const dots=[];
for(let k=0;k<(d=="ago"?12:8);k++){const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("class","nt");c.setAttribute("cx",245);c.setAttribute("cy",48+(k*17)%52);c.setAttribute("r",6);c.setAttribute("fill",k>=8?"#ffb454":"#7cff9e");c.style.transition="transform 1.4s,opacity .8s";s.appendChild(c);dots.push(c)}
setTimeout(()=>dots.forEach(c=>c.style.transform=`translateX(${d=="ant"?110:190}px)`),50);
if(d!="reu"&&d!="ago")setTimeout(()=>dots.forEach(c=>{c.style.transform="translateX(0)";c.style.opacity=.2}),2200)}

const MT=[["Lesion","Function","Learn what a region does by seeing what is lost without it.","Natural (stroke, injury) or deliberate in animals. Shows cause and effect."],
["EEG","Electrical activity","Need very fast timing of overall activity: sleep stages, seizures, alertness.","Scalp electrodes. Cheap and fast, poor at pinpointing location."],
["MEG","Magnetic fields","Need fast timing plus better location than EEG, such as mapping language or sensory responses.","Measures magnetic fields from neurons firing. Expensive."],
["CT scan","Structure","Need a quick structural picture, especially emergencies: head injury, bleeding, tumors.","X-rays from many angles combined by computer. Uses radiation; less soft-tissue detail than MRI."],
["PET","Function (glucose)","Want to see which areas are active during a task, or study metabolism.","Injected radioactive glucose collects in active areas. Slower than fMRI."],
["MRI","Structure (detailed)","Need a detailed picture of soft tissue: tumors, damage, shrinkage.","Magnetic fields and radio waves. Shows structure, not activity."],
["fMRI","Structure and function","Want to see which areas activate during a task like reading or remembering.","Compares successive MRI scans to track blood flow. Good location, slower than EEG."]];
function methods(){$("main").innerHTML=`<div class="card"><h3 class="ch">When to use each brain method</h3><div style="overflow-x:auto"><table class="tb"><tr><th>Method</th><th>Shows</th><th>Use it when</th><th>Key points</th></tr>${MT.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>
<div class="cues"><div class="pill"><b>Structure only:</b> CT and MRI</div><div class="pill"><b>Function:</b> EEG and MEG (electrical or magnetic, fast); PET and fMRI (glucose or blood flow, better location)</div><div class="pill"><b>Best timing:</b> EEG and MEG</div><div class="pill"><b>Best location with function:</b> fMRI</div><div class="pill"><b>Radioactive material:</b> PET</div><div class="pill"><b>What a region is needed for:</b> lesion</div></div>
<div class="pill"><b>Exam cues:</b> seizures or sleep stages: EEG. Tumor or bleeding in an emergency: CT. Which areas are active during a task: PET or fMRI. Detailed image of structure: MRI.</div></div>`}

const AP5=["Identify the research method used in this study (e.g., experiment, correlational study, case study, naturalistic observation, or meta-analysis).","State the exact, quantifiable way a specific variable was measured in the study (operational definition).","Explain what the data, or the difference in group means, actually reveals about the participants.","Identify how the researchers applied an ethical guideline (e.g., informed consent, debriefing, confidentiality).","Explain a limitation of the study's sample and whether the findings apply to the broader population.","Use specific numerical evidence from the results to explain whether the findings support or refute the hypothesis."];
const AAQS=[{t:"Study 1: Exercise and Pain Tolerance",s:"Researchers asked whether a single bout of vigorous exercise changes how much pain people can tolerate. Sixty college students were randomly assigned to run on a treadmill for 30 minutes or to sit quietly for 30 minutes. Immediately afterward, each participant placed a hand in ice water and kept it there as long as possible. Participants gave informed consent and could remove their hand at any time. Hypothesis: People who exercise will tolerate pain longer than people who sit quietly.",r:"Group    | n  | Mean time in ice water (s)\nExercise | 30 | 94\nSitting  | 30 | 71\nDifference is significant, p < .05",f:"Explain how a specific neurotransmitter or hormone could account for the results.",
m:["Experiment: the researchers manipulated the independent variable (exercise vs. sitting) and used random assignment.","Dependent variable: pain tolerance, operationally defined as the number of seconds a participant kept a hand in ice water.","On average, the exercise group tolerated the ice water about 23 seconds longer (94 s vs. 71 s), showing that people who exercised could tolerate more pain than those who sat. p < .05 means the difference is unlikely due to chance.","Informed consent and right to withdraw: participants agreed to take part knowing what would happen, and they could remove their hand at any time.","Only college students at one site were tested, so results may not generalize to older adults, other populations, or other kinds of exercise.","The results support the hypothesis (1 pt). The exercise group kept a hand in ice water for a mean of 94 seconds compared with 71 seconds for the sitting group, 23 seconds longer, and p < .05 means this is unlikely due to chance (1 pt)."]},
{t:"Study 2: Twins and Extraversion",s:"To estimate genetic influence on personality, researchers recruited 100 pairs of identical twins and 100 pairs of fraternal twins raised together. Each twin completed a 30-item questionnaire measuring extraversion; higher scores mean more outgoing. The researchers did not manipulate any variable. Responses were kept confidential. Hypothesis: Identical twins will be more similar in extraversion than fraternal twins.",r:"Twin type | Correlation of extraversion scores\nIdentical | r = +.55\nFraternal | r = +.25",f:"Explain how heredity and environment (interaction) relate to the results.",
m:["Correlational study (a twin study): extraversion was measured in twin pairs without manipulating variables or assigning conditions.","Extraversion, operationally defined as a person's total score on the 30-item questionnaire (higher means more outgoing).","Both correlations are positive: twin pairs' extraversion scores rise together, and identical twins are more alike than fraternal twins, suggesting genes influence extraversion. Correlation does not show causation.","Confidentiality: the twins' responses were kept confidential, protecting their privacy.","Volunteer twins from one region who completed self-reports may differ from the general population, and twins may not represent non-twins.","The results support the hypothesis (1 pt). The correlation for identical twins (+.55) was more than double that of fraternal twins (+.25), which fits genes mattering because identical twins share 100% of genes and fraternal about 50% (1 pt)."]},
{t:"Study 3: Sleep Deprivation and Memory",s:"Researchers tested whether missing a night of sleep affects memory. Forty adults were randomly assigned to sleep eight hours or stay awake for 24 hours. The next morning everyone studied a list of 30 words, and 20 minutes later wrote down as many as they remembered while lying in an fMRI scanner. All participants were screened for health problems and debriefed afterward. Hypothesis: Sleep-deprived adults will recall fewer words than rested adults.",r:"Group          | n  | Mean words recalled | Hippocampal activity\nNormal sleep   | 20 | 21.5                | Higher\nSleep-deprived | 20 | 14.2                | Lower\nWord-recall difference is significant, p < .01",f:"Explain how the hippocampus relates to the results and what fMRI measures.",
m:["Experiment: random assignment to two conditions, with sleep as the independent variable.","Memory, operationally defined as the number of the 30 words correctly recalled 20 minutes after studying.","The rested group recalled about 7 more words on average (21.5 vs. 14.2), showing that missing sleep worsened memory. p < .01 means a difference this large would occur by chance less than 1% of the time.","Screening and debriefing: participants were screened for health problems beforehand and debriefed afterward, which minimized harm.","Only 40 adults were tested in one lab with a simple word list, so results may not generalize to other ages, real-world memory, or chronic sleep loss.","The results support the hypothesis (1 pt). Sleep-deprived adults recalled a mean of 14.2 words compared with 21.5 for rested adults, 7.3 fewer, and p < .01 means this is unlikely due to chance (1 pt)."]}];
