<script>
function switchUnit(val){
  if(val==='index'){window.location.href='index.html';}
  else if(val==='unit0'){window.location.href='unit0.html';}
  else if(val==='unit1'){window.location.href='unit1.html';}

const C={G:"Genetics",N:"Nervous system",U:"Neuron",C:"Neurotransmitters & hormones",D:"Drugs",M:"Brain methods",S:"Brain structures",X:"Cortex"};
const D=[
["Psychology","G","Scientific study of behavior and mental processes."],
["Nature-nurture issue","G","Debate over how much genes (nature) vs. experience (nurture) shape us; both interact."],
["Natural selection","G","Inherited traits that aid survival and reproduction become more common over generations."],
["Evolutionary psychology","G","Studies how natural selection shaped behavior and mind to solve ancestral problems."],
["Mutation","G","Random error in gene replication; source of variation for natural selection."],
["Environment","G","Every nongenetic influence, from prenatal nutrition to culture."],
["Heredity","G","Genetic transfer of characteristics from parents to offspring."],
["Genes","G","DNA segments that code for proteins; biochemical units of heredity."],
["Identical (monozygotic) twins","G","Twins from one fertilized egg that splits; share 100% of genes."],
["Fraternal (dizygotic) twins","G","Twins from two separate eggs; share about 50% of genes."],
["Interaction","G","Effect of one factor (e.g. genes) depends on another (e.g. environment)."],
["Nervous system","N","Body's electrochemical communication network of all neurons."],
["Central nervous system (CNS)","N","Brain and spinal cord; makes decisions and processes information."],
["Peripheral nervous system (PNS)","N","Sensory and motor neurons connecting the CNS to the body."],
["Nerves","N","Bundles of axons forming cables between CNS and muscles, glands, sense organs."],
["Sensory (afferent) neurons","N","Carry incoming information from receptors to brain and spinal cord."],
["Motor (efferent) neurons","N","Carry outgoing commands from CNS to muscles and glands."],
["Interneurons","N","Neurons within CNS linking sensory input to motor output; most numerous type."],
["Somatic nervous system","N","PNS division controlling voluntary skeletal muscle movement."],
["Autonomic nervous system","N","PNS division controlling glands and internal organs automatically."],
["Sympathetic nervous system","N","Arouses body, mobilizes energy under stress (fight or flight)."],
["Parasympathetic nervous system","N","Calms body, conserves energy (rest and digest)."],
["Reflex","N","Simple automatic inborn response to a stimulus, handled by the spinal cord."],
["Neuron","U","Nerve cell; basic building block of the nervous system."],
["Glial cells","U","Support cells that nourish, insulate (myelin), and clean up around neurons."],
["Action potential","U","Brief electrical charge traveling down an axon as positive ions rush in."],
["Threshold","U","Level of stimulation needed to trigger a neural impulse."],
["Refractory period","U","Brief rest after firing during which a neuron cannot fire again."],
["All-or-none response","U","A neuron fires completely or not at all; strength is constant, rate can vary."],
["Resting potential","U","The state of a neuron when it is ready to fire but has not yet fired; the inside is negative relative to the outside."],
["Depolarization","U","When a neuron's charge becomes less negative, leading to firing (the start of the action potential)."],
["Multiple sclerosis (MS)","U","Disorder in which the myelin sheath is damaged, slowing down or blocking neural signals."],
["Blood-brain barrier","U","Protective barrier between the bloodstream and the brain, supported by glial cells, that controls which substances reach neurons."],
["Neurotransmitters","C","Chemical messengers crossing the synapse to excite or inhibit the next neuron.","Made in neuron cell bodies and stored in vesicles at the axon terminals.|Released when an action potential reaches the terminal, they cross the synapse and bind receptors like a key in a lock, exciting or inhibiting the next neuron. They are then cleared by reuptake or enzymes. The slides sort them as excitatory (dopamine, norepinephrine, glutamate) or inhibitory (GABA, serotonin, endorphins).|Carry messages between neurons and to muscles and glands, shaping movement, mood, memory, sleep, and arousal.|Too much or too little of a specific transmitter is tied to disorders such as Parkinson's, depression, and schizophrenia.|Drugs act as agonists (mimic), antagonists (block), or reuptake blockers."],
["Reuptake","C","Sending neuron reabsorbs leftover neurotransmitter; blocked by cocaine (dopamine) and many antidepressants."],
["Endorphins","C","Inhibitory neurotransmitters that act as natural painkillers; opiate-like, also tied to pleasure.","Released by neurons (and by the pituitary gland and hypothalamus) during pain, stress, vigorous exercise, and laughter.|Bind opioid receptors, which blocks pain signals and triggers dopamine release.|Natural pain relief, pleasure, well-being, and the 'runner's high'.|Low levels mean heightened pain sensitivity. Opioid drug use shuts down natural production, so stopping causes painful withdrawal.|The name means 'morphine within'. Heroin, morphine, and oxycodone are agonists of these receptors."],
["Agonist","C","Molecule that mimics or enhances a neurotransmitter's effect (antagonist blocks it).","Not made by the body; a drug or toxin molecule.|Shaped like a neurotransmitter, so it fits the receptor and activates it, imitating or enhancing the natural effect.|Boosts or copies the message of a neurotransmitter (heroin or morphine at endorphin receptors, nicotine at ACh receptors).|Overuse changes receptors and causes tolerance, dependence, and withdrawal.|Antagonists do the opposite by blocking receptors (curare, antipsychotics)."],
["Endocrine system","C","Slower chemical system of glands secreting hormones into the bloodstream.","Glands: pituitary, thyroid, parathyroids, adrenals, pancreas, ovaries or testes, and pineal.|Glands release hormones into the bloodstream, which carries them to distant target cells.|Slow, widespread control of growth, metabolism, stress, reproduction, hunger, and sleep.|Gland overactivity or underactivity causes disorders such as diabetes and thyroid disease.|The pituitary is the 'master gland', and the hypothalamus controls it, linking nervous and endocrine systems."],
["Hormones","C","Chemical messengers that travel through the bloodstream and affect behavior and mood; slower than neurotransmitters, but the message lasts longer.","Made by endocrine glands (pituitary, adrenals, pancreas, thyroid, ovaries, testes) and the hypothalamus.|Travel through the blood and bind receptors on target cells. Slower than neurotransmitters but effects last longer.|Regulate growth, metabolism, stress response, hunger, sleep, and sexual development.|Examples: diabetes (insulin), thyroid disorders, effects of chronic stress (cortisol, adrenaline).|A few chemicals work in both systems (norepinephrine is the classic example), but the slides sort norepinephrine as a neurotransmitter and adrenaline as a hormone."],
["Dopamine","C","Excitatory neurotransmitter involved in reward and motivation (also movement and attention).","Made in the midbrain (substantia nigra and ventral tegmental area); acts in reward and movement circuits.|Binds dopamine receptors and is cleared by reuptake; effect depends on the receptor type.|Reward, motivation, pleasure, voluntary movement, attention, and learning from rewards.|Too little: Parkinson's disease (tremors, slow movement). Too much: schizophrenia symptoms such as hallucinations and delusions.|Cocaine and amphetamines raise it; antipsychotics block its receptors; L-dopa treats Parkinson's. Addictive drugs flood the reward pathway."],
["Serotonin","C","Inhibitory neurotransmitter that regulates mood and sleep (also hunger and arousal).","Made in the brainstem raphe nuclei; most of the body's supply is actually in the gut.|Binds many receptor types and is cleared by reuptake, which SSRIs block.|Mood regulation, sleep, appetite, arousal, impulse control, and body temperature.|Low: depression, anxiety, OCD, aggression. Excess: serotonin syndrome (fever, agitation, tremor).|SSRIs (Prozac, Zoloft) raise it; LSD and psilocybin act on its receptors; MDMA releases it."],
["Acetylcholine (ACh)","C","Neurotransmitter for muscle action, learning, and memory; attacked by the immune system in myasthenia gravis.","Released by motor neurons at the neuromuscular junction and by neurons in the basal forebrain.|Binds receptors on muscle fibers to trigger contraction; in the brain it supports attention and memory circuits. An enzyme breaks it down.|All voluntary muscle contraction, learning, memory, attention, REM sleep, and parasympathetic organ control.|Too little: Alzheimer's (memory loss) and muscle weakness. Myasthenia gravis: an autoimmune disorder attacks ACh receptors, causing muscle weakness. Too much: spasms.|Curare and botulism toxin block it (paralysis), black widow venom floods it, and nicotine mimics it."],
["GABA","C","Major inhibitory neurotransmitter that calms the nervous system.","Made by interneurons throughout the brain and spinal cord; the main inhibitory neurotransmitter.|Opens chloride channels so the next neuron is less likely to fire.|Calms neural activity, reduces anxiety, promotes sleep, and balances excitation from glutamate.|Too little: anxiety, seizures, tremors. Too much: sedation and slowed breathing.|Alcohol, barbiturates, and benzodiazepines boost GABA, causing drowsiness and slurred speech."],
["Glutamate","C","Most common excitatory neurotransmitter; linked to learning and memory.","The most common excitatory transmitter; used by most cortex and hippocampus neurons.|Binds receptors (including NMDA) that let ions in, making firing more likely.|Learning and memory through long-term potentiation, sensory processing, and general brain activation.|Too much: overexcitation, seizures, migraines, and neuron death after stroke.|Counterpart to GABA. MSG can overstimulate; ketamine and PCP block NMDA receptors."],
["Substance P","C","Neurotransmitter that carries pain signals to the brain; released by sensory neurons after injury or stress.","Released by sensory neurons in response to injury or stress.|Transmits pain signals to the brain and increases blood flow to injured areas, adding to inflammation.|Pain perception (alerts the brain to injury) and the inflammatory response (more blood flow to the injured area).|High levels are associated with chronic pain conditions such as arthritis and fibromyalgia, and can influence anxiety and stress, so pain is emotional as well as physical.|Called the 'pain messenger'. Do not confuse with endorphins, the natural painkillers that dampen pain."],
["Norepinephrine","C","Excitatory neurotransmitter that arouses alertness and energy.","Made in the locus coeruleus of the brainstem and at sympathetic nerve endings. (Beyond the slides: adrenal glands also release it into the blood.)|Binds adrenergic receptors during sympathetic activation and is cleared by reuptake.|Arousal, alertness, attention, raising heart rate and blood pressure, and memory of emotional events.|Too little: depression, low energy, poor focus. Too much: anxiety, panic, high blood pressure.|Amphetamines and cocaine raise it; SNRIs block its reuptake. A close chemical relative of epinephrine (adrenaline), which the slides classify as a hormone."],
["Epinephrine (adrenaline)","C","Hormone from the adrenal glands that increases heart rate and energy (fight or flight).","Made by the adrenal medulla, on top of the kidneys, when the sympathetic nervous system fires.|Released into the blood; binds receptors on the heart, lungs, liver, and muscles.|Fight or flight: raises heart rate, blood pressure, and blood sugar, widens airways, and slows digestion.|Chronic excess: hypertension, anxiety, and exhaustion.|EpiPens deliver it to stop severe allergic reactions. Norepinephrine is its close relative."],
["Insulin","C","Pancreatic hormone that lowers blood glucose.","Made by beta cells of the pancreas.|Tells cells to take up glucose from the blood; the liver stores excess as glycogen.|Lowers blood sugar, stores energy, and influences hunger.|Type 1: no insulin made. Type 2: cells resist it. Too much: low blood sugar, shakiness, hunger.|Works opposite glucagon, which raises blood sugar."],
["Leptin","C","Hormone that regulates hunger and fat storage; made by fat cells and signals fullness.","Made by fat cells.|Travels to the hypothalamus to signal that energy stores are sufficient.|Suppresses appetite and increases energy use.|Leptin resistance leads to constant hunger and weight gain; low leptin from dieting increases hunger.|Leptin turns appetite down; ghrelin turns it up."],
["Ghrelin","C","Stomach hormone that stimulates hunger.","Made by the stomach lining.|Travels to the hypothalamus, stimulating hunger centers.|Triggers hunger and food seeking, rising before meals.|Rises with dieting and poor sleep, making weight loss harder.|Mnemonic: ghrelin makes your stomach growl."],
["Oxytocin","C","Hormone that influences bonding and social behavior; also birth and nursing.","Made in the hypothalamus and released by the pituitary gland.|Acts on the uterus, breasts, and brain; released with touch, birth, and nursing.|Bonding, trust, labor contractions, milk release, and attachment.|Can increase in-group bias and envy; low levels are linked to social difficulties in some research.|Called the 'cuddle hormone'; a synthetic form is used to induce labor."],
["Melatonin","C","Pineal hormone that regulates sleep-wake cycles.","Made by the pineal gland in the brain.|Released in darkness, controlled by the brain's biological clock; light suppresses it.|Regulates the sleep-wake cycle and promotes drowsiness.|Light at night, jet lag, and shift work disrupt it and cause insomnia.|Supplements are used for jet lag. Teens release it later, explaining late sleep schedules."],
["Psychoactive drugs","D","Chemicals that change perception and mood by altering neural activity.","Alter neurotransmitter release, receptors, or reuptake.|Change mood, perception, arousal.|Tolerance, dependence, withdrawal."],
["Depressants","D","Drugs that slow neural activity and body functions (alcohol, barbiturates, tranquilizers).","Boost GABA and slow neural firing.|Relaxation, lowered inhibition, drowsiness.|Slurred speech, impaired memory and judgment, blackouts, respiratory failure; dangerous mixed together. Alcohol: aggression, liver damage."],
["Tolerance","D","Diminishing effect of the same dose; larger doses needed."],
["Addiction","D","Compulsive drug craving and use despite harmful consequences."],
["Withdrawal","D","Discomfort and distress after stopping an addictive drug."],
["Opioids","D","Opium derivatives (morphine, heroin, oxycodone) that depress neural activity and relieve pain.","Mimic endorphins at opioid receptors; brain reduces its own endorphins.|Pain relief, euphoria, calm.|Constipation, drowsiness, slowed breathing and fatal overdose, severe withdrawal, high addiction risk."],
["Stimulants","D","Drugs that excite neural activity and speed body functions (caffeine, nicotine, cocaine, amphetamines, meth).","Boost dopamine, norepinephrine, and serotonin (cocaine blocks dopamine reuptake; amphetamines boost release; ecstasy boosts serotonin).|Energy, alertness, euphoria, reduced appetite.|Anxiety, insomnia, high blood pressure, heart problems; crash, depression, paranoia, addiction. Nicotine: highly addictive, cancer risk."],
["Hallucinogens","D","Psychedelics (LSD, psilocybin, marijuana in some systems) that distort perception without sensory input.","LSD and psilocybin act on serotonin receptors; THC binds cannabinoid receptors.|Altered perception, vivid imagery, mood shifts, relaxation (THC).|Panic, paranoia, flashbacks; THC: impaired memory and coordination, possible respiratory harm."],

const AP5=["Identify the research method used in this study (e.g., experiment, correlational study, case study, naturalistic observation, or meta-analysis).","State the exact, quantifiable way a specific variable was measured in the study (operational definition).","Explain what the data, or the difference in group means, actually reveals about the participants.","Identify how the researchers applied an ethical guideline (e.g., informed consent, debriefing, confidentiality).","Explain a limitation of the study's sample and whether the findings apply to the broader population.","Use specific numerical evidence from the results to explain whether the findings support or refute the hypothesis."];
const AAQS=[{t:"Study 1: Exercise and Pain Tolerance",s:"Researchers asked whether a single bout of vigorous exercise changes how much pain people can tolerate. Sixty college students were randomly assigned to run on a treadmill for 30 minutes or to sit quietly for 30 minutes. Immediately afterward, each participant placed a hand in ice water and kept it there as long as possible. Participants gave informed consent and could remove their hand at any time. Hypothesis: People who exercise will tolerate pain longer than people who sit quietly.",r:"Group    | n  | Mean time in ice water (s)\nExercise | 30 | 94\nSitting  | 30 | 71\nDifference is significant, p < .05",f:"Explain how a specific neurotransmitter or hormone could account for the results.",
m:["Experiment: the researchers manipulated the independent variable (exercise vs. sitting) and used random assignment.","Dependent variable: pain tolerance, operationally defined as the number of seconds a participant kept a hand in ice water.","On average, the exercise group tolerated the ice water about 23 seconds longer (94 s vs. 71 s), showing that people who exercised could tolerate more pain than those who sat. p < .05 means the difference is unlikely due to chance.","Informed consent and right to withdraw: participants agreed to take part knowing what would happen, and they could remove their hand at any time.","Only college students at one site were tested, so results may not generalize to older adults, other populations, or other kinds of exercise.","The results support the hypothesis (1 pt). The exercise group kept a hand in ice water for a mean of 94 seconds compared with 71 seconds for the sitting group, 23 seconds longer, and p < .05 means this is unlikely due to chance (1 pt)."]},
{t:"Study 2: Twins and Extraversion",s:"To estimate genetic influence on personality, researchers recruited 100 pairs of identical twins and 100 pairs of fraternal twins raised together. Each twin completed a 30-item questionnaire measuring extraversion; higher scores mean more outgoing. The researchers did not manipulate any variable. Responses were kept confidential. Hypothesis: Identical twins will be more similar in extraversion than fraternal twins.",r:"Twin type | Correlation of extraversion scores\nIdentical | r = +.55\nFraternal | r = +.25",f:"Explain how heredity and environment (interaction) relate to the results.",
m:["Correlational study (a twin study): extraversion was measured in twin pairs without manipulating variables or assigning conditions.","Extraversion, operationally defined as a person's total score on the 30-item questionnaire (higher means more outgoing).","Both correlations are positive: twin pairs' extraversion scores rise together, and identical twins are more alike than fraternal twins, suggesting genes influence extraversion. Correlation does not show causation.","Confidentiality: the twins' responses were kept confidential, protecting their privacy.","Volunteer twins from one region who completed self-reports may differ from the general population, and twins may not represent non-twins.","The results support the hypothesis (1 pt). The correlation for identical twins (+.55) was more than double that of fraternal twins (+.25), which fits genes mattering because identical twins share 100% of genes and fraternal about 50% (1 pt)."]},
{t:"Study 3: Sleep Deprivation and Memory",s:"Researchers tested whether missing a night of sleep affects memory. Forty adults were randomly assigned to sleep eight hours or stay awake for 24 hours. The next morning everyone studied a list of 30 words, and 20 minutes later wrote down as many as they remembered while lying in an fMRI scanner. All participants were screened for health problems and debriefed afterward. Hypothesis: Sleep-deprived adults will recall fewer words than rested adults.",r:"Group          | n  | Mean words recalled | Hippocampal activity\nNormal sleep   | 20 | 21.5                | Higher\nSleep-deprived | 20 | 14.2                | Lower\nWord-recall difference is significant, p < .01",f:"Explain how the hippocampus relates to the results and what fMRI measures.",
m:["Experiment: random assignment to two conditions, with sleep as the independent variable.","Memory, operationally defined as the number of the 30 words correctly recalled 20 minutes after studying.","The rested group recalled about 7 more words on average (21.5 vs. 14.2), showing that missing sleep worsened memory. p < .01 means a difference this large would occur by chance less than 1% of the time.","Screening and debriefing: participants were screened for health problems beforehand and debriefed afterward, which minimized harm.","Only 40 adults were tested in one lab with a simple word list, so results may not generalize to other ages, real-world memory, or chronic sleep loss.","The results support the hypothesis (1 pt). Sleep-deprived adults recalled a mean of 14.2 words compared with 21.5 for rested adults, 7.3 fewer, and p < .01 means this is unlikely due to chance (1 pt)."]}];
