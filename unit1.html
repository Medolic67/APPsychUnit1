const C={
  N:"Neuron & Neural Signaling",
  NT:"Neurotransmitters & Drugs",
  NS:"Nervous & Endocrine Systems",
  B:"Brain Structures & Functions",
  G:"Genetics, Plasticity & Consciousness"
};

const D=[
  ["Neuron","N","A nerve cell; the basic building block of the nervous system."],
  ["Dendrites","N","A neuron's often bushy, branching extensions that receive and integrate messages, conducting impulses toward the cell body."],
  ["Axon","N","The neuron extension that passes messages through its branches to other neurons or to muscles or glands."],
  ["Myelin sheath","N","A fatty tissue layer segmentally encasing the axons of some neurons; enables vastly greater transmission speed of neural impulses."],
  ["Glial cells","N","Cells in the nervous system that support, nourish, and protect neurons; they also play a role in learning, thinking, and memory."],
  ["Action potential","N","A neural impulse; a brief electrical charge that travels down an axon."],
  ["Threshold","N","The level of stimulation required to trigger a neural impulse."],
  ["Refractory period","N","In neural processing, a brief resting pause that occurs after a neuron has fired; subsequent action potentials cannot occur until the axon returns to its resting state."],
  ["All-or-none response","N","A neuron's reaction of either firing (with a full-strength response) or not firing."],
  ["Synapse","N","The junction between the axon tip of the sending neuron and the dendrite or cell body of the receiving neuron."],
  ["Neurotransmitters","NT","Chemical messengers that cross the synaptic gaps between neurons.","Made in neuron cell bodies and stored in vesicles at the axon terminals.|Released when an action potential reaches the terminal, they cross the synapse and bind receptors like a key in a lock, exciting or inhibiting the next neuron. They are then cleared by reuptake or enzymes.|Carry messages between neurons and to muscles and glands, shaping movement, mood, memory, sleep, and arousal.|Too much or too little of a specific transmitter is tied to disorders such as Parkinson's, depression, and schizophrenia.|Drugs act as agonists (mimic), antagonists (block), or reuptake blockers."],
  ["Reuptake","NT","A neurotransmitter's reabsorption by the sending neuron."],
  ["Endorphins","NT","Natural, opiate-like neurotransmitters linked to pain control and to pleasure.","Released by the pituitary gland and hypothalamus during pain, stress, vigorous exercise, and laughter.|Bind opioid receptors, which blocks pain signals and triggers dopamine release.|Natural pain relief, pleasure, well-being, and the 'runner's high'.|Low levels mean heightened pain sensitivity. Opioid drug use shuts down natural production, so stopping causes painful withdrawal.|The name means 'morphine within'. Heroin, morphine, and oxycodone are agonists of these receptors."],
  ["Agonist","NT","A molecule that increases a neurotransmitter's action.","Not made by the body; a drug or toxin molecule.|Shaped like a neurotransmitter, so it fits the receptor and activates it, imitating or enhancing the natural effect.|Boosts or copies the message of a neurotransmitter (morphine at endorphin receptors, nicotine at ACh receptors).|Overuse changes receptors and causes tolerance, dependence, and withdrawal.|Antagonists do the opposite by blocking receptors (curare, antipsychotics)."],
  ["Antagonist","NT","A molecule that inhibits or blocks a neurotransmitter's action."],
  ["Dopamine","NT","Neurotransmitter for reward, movement, and attention.","Made in the midbrain (substantia nigra and ventral tegmental area); acts in reward and movement circuits.|Binds dopamine receptors and is cleared by reuptake; effect depends on the receptor type.|Reward, motivation, pleasure, voluntary movement, attention, and learning from rewards.|Too little: Parkinson's disease (tremors, slow movement). Too much: schizophrenia symptoms such as hallucinations and delusions.|Cocaine and amphetamines raise it; antipsychotics block its receptors; L-dopa treats Parkinson's. Addictive drugs flood the reward pathway."],
  ["Serotonin","NT","Neurotransmitter affecting mood, hunger, sleep, and arousal.","Made in the brainstem raphe nuclei; most of the body's supply is actually in the gut.|Binds many receptor types and is cleared by reuptake, which SSRIs block.|Mood regulation, sleep, appetite, arousal, impulse control, and body temperature.|Low: depression, anxiety, OCD, aggression. Excess: serotonin syndrome (fever, agitation, tremor).|SSRIs (Prozac, Zoloft) raise it; LSD and psilocybin act on its receptors; MDMA releases it."],
  ["Acetylcholine (ACh)","NT","Neurotransmitter for muscle action, learning, and memory.","Released by motor neurons at the neuromuscular junction and by neurons in the basal forebrain.|Binds receptors on muscle fibers to trigger contraction; in the brain it supports attention and memory circuits. An enzyme breaks it down.|All voluntary muscle contraction, learning, memory, attention, REM sleep, and parasympathetic organ control.|Too little: Alzheimer's (memory loss) and muscle weakness. Too much: spasms.|Curare and botulism toxin block it (paralysis), black widow venom floods it, and nicotine mimics it."],
  ["GABA","NT","Major inhibitory neurotransmitter.","Made by interneurons throughout the brain and spinal cord; the main inhibitory neurotransmitter.|Opens chloride channels so the next neuron is less likely to fire.|Calms neural activity, reduces anxiety, promotes sleep, and balances excitation from glutamate.|Too little: anxiety, seizures, tremors. Too much: sedation and slowed breathing.|Alcohol, barbiturates, and benzodiazepines boost GABA, causing drowsiness and slurred speech."],
  ["Glutamate","NT","Major excitatory neurotransmitter involved in learning and memory.","The most common excitatory transmitter; used by most cortex and hippocampus neurons.|Binds receptors (including NMDA) that let ions in, making firing more likely.|Learning and memory through long-term potentiation, sensory processing, and general brain activation.|Too much: overexcitation, seizures, migraines, and neuron death after stroke.|Counterpart to GABA. MSG can overstimulate; ketamine and PCP block NMDA receptors."],
  ["Norepinephrine","NT","Neurotransmitter and hormone that increases arousal and alertness.","Made in the locus coeruleus of the brainstem and at sympathetic nerve endings; also released by adrenal glands.|Binds adrenergic receptors during sympathetic activation and is cleared by reuptake.|Arousal, alertness, attention, raising heart rate and blood pressure, and memory of emotional events.|Too little: depression, low energy, poor focus. Too much: anxiety, panic, high blood pressure.|Amphetamines and cocaine raise it; SNRIs block its reuptake. A close relative of epinephrine."],
  ["Epinephrine (adrenaline)","NT","Hormone from adrenal glands that triggers fight or flight.","Made by the adrenal medulla, on top of the kidneys, when the sympathetic nervous system fires.|Released into the blood; binds receptors on the heart, lungs, liver, and muscles.|Fight or flight: raises heart rate, blood pressure, and blood sugar, widens airways, and slows digestion.|Chronic excess: hypertension, anxiety, and exhaustion.|EpiPens deliver it to stop severe allergic reactions. Norepinephrine is its close relative."],
  ["Depressants","NT","Drugs that slow neural activity and body functions (alcohol, barbiturates, tranquilizers).","Boost GABA and slow neural firing.|Relaxation, lowered inhibition, drowsiness.|Slurred speech, impaired memory and judgment, blackouts, respiratory failure; dangerous mixed together. Alcohol: aggression, liver damage."],
  ["Opioids","NT","Opium derivatives (morphine, heroin, oxycodone) that depress neural activity and relieve pain.","Mimic endorphins at opioid receptors; brain reduces its own endorphins.|Pain relief, euphoria, calm.|Constipation, drowsiness, slowed breathing and fatal overdose, severe withdrawal, high addiction risk."],
  ["Stimulants","NT","Drugs that excite neural activity and speed body functions (caffeine, nicotine, cocaine, amphetamines, meth).","Increase dopamine/norepinephrine (cocaine blocks reuptake; amphetamines boost release).|Energy, alertness, euphoria, reduced appetite.|Anxiety, insomnia, high blood pressure, heart problems; crash, depression, paranoia, addiction. Nicotine: highly addictive, cancer risk."],
  ["Hallucinogens","NT","Psychedelics (LSD, psilocybin, marijuana) that distort perception without sensory input.","LSD and psilocybin act on serotonin receptors; THC binds cannabinoid receptors.|Altered perception, vivid imagery, mood shifts, relaxation (THC).|Panic, paranoia, flashbacks; THC: impaired memory and coordination, possible respiratory harm."],
  ["Nervous system","NS","The body's speedy, electrochemical communication network, consisting of all the nerve cells of the peripheral and central nervous systems."],
  ["Central nervous system (CNS)","NS","The brain and spinal cord."],
  ["Peripheral nervous system (PNS)","NS","The sensory and motor neurons that connect the central nervous system to the rest of the body."],
  ["Nerves","NS","Bundled axons that form neural cables connecting the central nervous system with muscles, glands, and sense organs."],
  ["Sensory (afferent) neurons","NS","Neurons that carry incoming information from the body's tissues and sensory receptors to the brain and spinal cord."],
  ["Motor (efferent) neurons","NS","Neurons that carry outgoing information from the brain and spinal cord to the muscles and glands."],
  ["Interneurons","NS","Neurons within the brain and spinal cord that communicate internally and process information between sensory inputs and motor outputs."],
  ["Somatic nervous system","NS","The division of the peripheral nervous system that controls the body's skeletal muscles."],
  ["Autonomic nervous system","NS","The part of the peripheral nervous system that controls the glands and the muscles of the internal organs."],
  ["Sympathetic nervous system","NS","The division of the autonomic nervous system that arouses the body, mobilizing its energy."],
  ["Parasympathetic nervous system","NS","The division of the autonomic nervous system that calms the body, conserving its energy."],
  ["Reflex","NS","A simple, automatic response to a sensory stimulus, such as the knee-jerk response."],
  ["Endocrine system","NS","The body's 'slow' chemical communication system; a set of glands that secrete hormones into the bloodstream.","Glands: pituitary, thyroid, parathyroids, adrenals, pancreas, ovaries or testes, and pineal.|Glands release hormones into the bloodstream, which carries them to distant target cells.|Slow, widespread control of growth, metabolism, stress, reproduction, hunger, and sleep.|Gland overactivity or underactivity causes disorders such as diabetes and thyroid disease.|The pituitary is the 'master gland', and the hypothalamus controls it, linking nervous and endocrine systems."],
  ["Hormones","NS","Chemical messengers that are manufactured by the endocrine glands, travel through the bloodstream, and affect other tissues.","Made by endocrine glands (pituitary, adrenals, pancreas, thyroid, ovaries, testes) and the hypothalamus.|Travel through the blood and bind receptors on target cells. Slower than neurotransmitters but effects last longer.|Regulate growth, metabolism, stress response, hunger, sleep, and sexual development.|Examples: diabetes (insulin), thyroid disorders, effects of chronic stress (cortisol, adrenaline).|Some chemicals act as both hormone and neurotransmitter (norepinephrine)."],
  ["Adrenal glands","NS","A pair of endocrine glands that sit just above the kidneys and secrete hormones (epinephrine and norepinephrine) that help arouse the body in times of stress."],
  ["Pituitary gland","NS","The endocrine system's most influential gland. Under the influence of the hypothalamus, the pituitary regulates growth and controls other endocrine glands."],
  ["Lesion","B","Tissue destruction. A brain lesion is a naturally or experimentally caused destruction of brain tissue."],
  ["Electroencephalogram (EEG)","B","An amplified recording of the waves of electrical activity sweeping across the brain's surface. These waves are measured by electrodes placed on the scalp."],
  ["PET (positron emission tomography) scan","B","A visual display of brain activity that detects where a radioactive form of glucose goes while the brain performs a given task."],
  ["MRI (magnetic resonance imaging)","B","A technique that uses magnetic fields and radio waves to produce computer-generated images of soft tissue."],
  ["fMRI (functional MRI)","B","A technique for revealing bloodflow and, therefore, brain activity by comparing successive MRI scans."],
  ["Brainstem","B","The oldest part and central core of the brain, beginning where the spinal cord swells as it enters the skull; responsible for automatic survival functions."],
  ["Medulla","B","The base of the brainstem; controls heartbeat and breathing."],
  ["Thalamus","B","The brain's sensory control center, located on top of the brainstem; it directs messages to the sensory receiving areas in the cortex and transmits replies to the cerebellum and medulla."],
  ["Reticular formation","B","A nerve network that travels through the brainstem into the thalamus and plays an important role in controlling arousal."],
  ["Cerebellum","B","The 'little brain' at the rear of the brainstem; functions include processing sensory input, coordinating movement output and balance, and enabling nonverbal learning and memory."],
  ["Limbic system","B","Neural system located below the cerebral hemispheres; associated with emotions and drives."],
  ["Amygdala","B","Two lima-bean-sized neural clusters in the limbic system; linked to emotion."],
  ["Hypothalamus","B","A neural structure lying below the thalamus; it directs several maintenance activities (eating, drinking, body temperature), helps govern the endocrine system via the pituitary gland, and is linked to emotion and reward."],
  ["Hippocampus","B","A neural center located in the limbic system; helps process explicit (conscious) memories of facts and events for storage."],
  ["Broca's area","B","Left frontal lobe area controlling speech production (forming words); damage causes Broca's aphasia."],
  ["Wernicke's area","B","Left temporal lobe area for language comprehension; damage causes Wernicke's aphasia."],
  ["Cerebral cortex","B","The intricate fabric of interconnected neural cells covering the cerebral hemispheres; the body's ultimate control and information-processing center."],
  ["Frontal lobes","B","The portion of the cerebral cortex lying just behind the forehead; involved in speaking and muscle movements and in making plans and judgments."],
  ["Parietal lobes","B","The portion of the cerebral cortex lying at the top of the head and toward the rear; receives sensory input for touch and body position."],
  ["Occipital lobes","B","The portion of the cerebral cortex lying at the back of the head; includes areas that receive information from the visual fields."],
  ["Temporal lobes","B","The portion of the cerebral cortex lying roughly above the ears; includes the auditory areas."],
  ["Motor cortex","B","An area at the rear of the frontal lobes that controls voluntary movements."],
  ["Somatosensory cortex","B","An area at the front of the parietal lobes that registers and processes body touch and movement sensations."],
  ["Association areas","B","Areas of the cerebral cortex that are not involved in primary motor or sensory functions; rather, they are involved in higher mental functions."],
  ["Corpus callosum","B","The large band of neural fibers connecting the two brain hemispheres and carrying messages between them."],
  ["Split brain","B","A condition resulting from surgery that isolates the brain's two hemispheres by cutting the fibers connecting them."],
  ["Plasticity","G","The brain's ability to change, especially during childhood, by reorganizing after damage or by building new pathways based on experience."],
  ["Neurogenesis","G","The formation of new neurons."],
  ["Consciousness","G","Our subjective awareness of ourselves and our environment."],
  ["Dual processing","G","The principle that information is often simultaneously processed on separate conscious and unconscious tracks."],
  ["Blindsight","G","A condition in which a person can respond to a visual stimulus without consciously experiencing it."],
  ["Parallel processing","G","Processing many aspects of a problem simultaneously; generally used to process well-learned information or to solve easy problems."],
  ["Sequential processing","G","Processing one aspect of a problem at a time; generally used to process new information or to solve complex problems."],
  ["Behavior genetics","G","The study of the relative power and limits of genetic and environmental influences on behavior."],
  ["Heredity","G","The genetic transfer of characteristics from parents to offspring."],
  ["Environment","G","Every nongenetic influence, from prenatal nutrition to the people and things around us."],
  ["Chromosomes","G","Threadlike structures made of DNA molecules that contain the genes."],
  ["DNA (deoxyribonucleic acid)","G","A complex molecule containing the genetic information that makes up the chromosomes."],
  ["Genes","G","The biochemical units of heredity that make up the chromosomes; segments of DNA capable of synthesizing proteins."],
  ["Genome","G","The complete instructions for making an organism, consisting of all the genetic material in that organism's chromosomes."],
  ["Identical (monozygotic) twins","G","Develop from a single fertilized egg that splits in two, creating two genetically identical organisms."],
  ["Fraternal (dizygotic) twins","G","Develop from separate fertilized eggs. They are genetically no closer than ordinary brothers and sisters, but they share a prenatal environment."],
  ["Heritability","G","The proportion of variation among individuals in a group that we can attribute to genes."],
  ["Epigenetics","G","The study of environmental influences on gene expression that occur without a DNA change."],
  ["Evolutionary psychology","G","The study of the evolution of behavior and the mind, using principles of natural selection."],
  ["Natural selection","G","The principle that inherited traits that better enable an organism to survive and reproduce in a particular environment will most likely be passed on."]
];

const $=id=>document.getElementById(id);
const sh=a=>{a=[...a];for(let i=a.length;i>1;){let j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};

let mode="flash",scope="all",cats=new Set(Object.keys(C)),miss=new Set(),miss_only=false;
const MODES={gloss:"Glossary",browse:"Detail Notes",methods:"Brain Methods",brain:"Brain Map",neuron:"Neuron Lab",flash:"Flashcards",match:"Matching",quiz:"Quiz",func:"Function Match",type:"Type-In",app:"Applications",aaq:"AAQ Practice"};
const IC={gloss:"book-open",browse:"list",methods:"microscope",brain:"brain",neuron:"bolt",flash:"clone",match:"puzzle-piece",quiz:"list-check",func:"bullseye",type:"keyboard",app:"flask",aaq:"file-pen"};

function pool(n){let p=sh(D.filter(d=>cats.has(d[1])&&(!miss_only||miss.has(d[0]))));return scope=="rand"?p.slice(0,n):p}

function det(d){
  if(!d[3])return"";
  const a=d[3].split("|"),L=a.length>3?["Where it comes from","How it works","Main functions","When imbalanced","Drugs and exam tips"]:["How it works","Main effects","Side effects"];
  return'<div class="det">'+a.map((x,i)=>`<div><b>${L[i]}:</b> ${x}</div>`).join("")+"</div>";
}

function bar(){
  $("modes").innerHTML=Object.keys(MODES).map(k=>`<button class="tab ${k==mode?"on":""}" onclick="mode='${k}';go()"><i class="fa-solid fa-${IC[k]}"></i> ${MODES[k]}</button>`).join("");
  $("scope").innerHTML=[["rand","Random 10"],["all","All Terms"]].map(([k,v])=>`<button class="${k==scope?"on":""}" onclick="scope='${k}';go()">${v}</button>`).join("")+`<button class="${miss_only?"on":""}" onclick="miss_only=!miss_only;go()">Missed (${miss.size})</button>`;
  $("cats").innerHTML=`<button onclick="cats=new Set(Object.keys(C));go()">All Categories</button>`+Object.entries(C).map(([k,v])=>`<button class="${cats.has(k)?"on":""}" onclick="tog('${k}')">${v}</button>`).join("");

  document.querySelectorAll(".opt").forEach(x=>x.disabled=true);

let M={t:[],d:[],s:null,left:0};
function match(){
  const r=Q.slice(i,i+6);
  if(!r.length)return done();
  M={t:sh(r),d:sh(r),s:null,left:r.length};
  drawM();
}

function drawM(){
  $("main").innerHTML=`<div class="mu">Match terms with definitions. ${M.left} remaining.</div>
  <div class="grid">
    <div>${M.t.map(x=>`<button class="opt ${M.s&&M.s.type=='t'&&M.s.val==x?'on':''}" onclick="selM('t', '${x[0].replace(/'/g,"\\'")}')">${x[0]}</button>`).join("")}</div>
    <div>${M.d.map(x=>`<button class="opt ${M.s&&M.s.type=='d'&&M.s.val==x?'on':''}" onclick="selM('d', '${x[0].replace(/'/g,"\\'")}')">${x[2]}</button>`).join("")}</div>
  </div>`;
}

function selM(type, valStr){
  const obj = D.find(x=>x[0]===valStr);
  if(!M.s){
    M.s={type, val:obj};
    drawM();
  } else if(M.s.type===type){
    M.s={type, val:obj};
    drawM();
  } else {
    if(M.s.val[0]===obj[0]){
      sc++;
      M.t=M.t.filter(x=>x[0]!==obj[0]);
      M.d=M.d.filter(x=>x[0]!==obj[0]);
      M.left--;
      M.s=null;
      if(M.left===0) i+=6;
      if(i>=Q.length) done(); else drawM();
    } else {
      miss.add(obj[0]);
      bar();
      alert("Incorrect match! Try again.");
      M.s=null;
      drawM();
    }
  }
}

const NP={

  myelin:["Myelin sheath","Fatty insulation made by glial cells; makes impulses faster as they jump between gaps. Loss of myelin occurs in multiple sclerosis."],
  term:["Axon terminals and synapse","Release neurotransmitters into the synaptic gap; they bind receptors on the next neuron and excite or inhibit it."]
};
const PH=[
  ["Resting potential (-70 mV)","The inside is negative relative to the outside; closed channels keep Na+ out."],
  ["Threshold (-55 mV)","Enough excitatory input reaches the hillock. Below threshold nothing happens; at threshold the neuron fires."],
  ["Depolarization","Na+ channels open and Na+ rushes in, making the inside briefly positive (about +40 mV)."],

  ["Refractory period","Pumps restore the resting charge; the neuron cannot fire again for a moment, so impulses travel one way."]
];
const SYM={

  ant:"An antagonist (like curare blocking ACh) blocks receptors, so the message does not get through.",
  reu:"Blocking reuptake (SSRIs, cocaine) leaves neurotransmitter in the gap longer, prolonging its effect."
};

function ps(i){$("pi").innerHTML=`<b>${PH[i][0]}:</b> ${PH[i][1]}`}
function fire(){
  const v=+$("st").value;
  if(v<50){$("pi").innerHTML="<b>Below threshold:</b> no action potential. A neuron is all-or-none, so weak stimuli do nothing.";return}
  const p=$("ap"),L=p.getTotalLength()*.54,g=$("gd"),m=$("imp"),t0=performance.now();
  m.setAttribute("opacity",1);
  (function f(t){
    const k=Math.min(1,(t-t0)/2600),q=p.getPointAtLength(k*L);
    g.setAttribute("cx",q.x);g.setAttribute("cy",q.y);
    m.setAttribute("cx",190+k*400);
    ps(q.x<150?0:q.x<200?2:q.x<240?3:4);
    if(k<1)requestAnimationFrame(f);
    else{
      m.setAttribute("opacity",0);
      $("pi").innerHTML="<b>Done:</b> impulse traveled down the axon. A stronger stimulus causes higher firing frequency (all-or-none principle).";
    }
  })(t0);
}
function rel(){
  const s=$("sy"),d=$("dr").value;
  s.querySelectorAll(".nt").forEach(e=>e.remove());
  const dots=[];
  for(let k=0;k<(d=="ago"?12:8);k++){
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("class","nt");c.setAttribute("cx",245);c.setAttribute("cy",48+(k*17)%52);
    c.setAttribute("r",6);c.setAttribute("fill",k>=8?"#ffb454":"#7cff9e");
    c.style.transition="transform 1.4s,opacity .8s";
    s.appendChild(c);dots.push(c);
  }
  setTimeout(()=>dots.forEach(c=>c.style.transform=`translateX(${d=="ant"?110:190}px)`),50);
  if(d!="reu"&&d!="ago")setTimeout(()=>dots.forEach(c=>{c.style.transform="translateX(0)";c.style.opacity=.2}),2200);
}

/* 7. Function Match & Application Questions */
let FD="m",FK="m",CUR=null;
const GRP=[["Acetylcholine (ACh)","Glutamate"],["Epinephrine (adrenaline)","Norepinephrine"],["Endorphins","Dopamine"],["Frontal lobes","Broca's area","Motor cortex"],["Temporal lobes","Wernicke's area"],["Parietal lobes","Somatosensory cortex"],["Brainstem","Medulla","Reticular formation"],["Hypothalamus","Pituitary gland"],["Serotonin","Melatonin"]];
const cf=(a,b)=>GRP.some(g=>g.includes(a)&&g.includes(b));

function fitems(){
  const o=[];
  if(FK!="c")Object.values(BR).forEach(v=>o.push({n:v[0],f:v[2].replace(" (no shape here)",""),g:"b",x:`<p><b>If damaged:</b> ${v[3]}</p>`}));
  if(FK!="b")D.filter(d=>d[1]=="NT"&&d[3]&&d[3].split("|").length>3&&!["Neurotransmitters","Agonist","Endocrine system","Hormones"].includes(d[0])).forEach(d=>o.push({n:d[0],f:d[3].split("|")[2],g:"c",x:det(d)}));
  return o;
}

function func(){Q=sh(fitems());if(scope=="rand")Q=Q.slice(0,10);i=0;sc=0;fq()}
function fq(){
  if(i>=Q.length)return done();
  const it=Q[i],rv2=FD=="b"||(FD=="m"&&Math.random()<.5);
  const o=sh([it,...sh(fitems().filter(x=>x.g==it.g&&x.n!=it.n&&!cf(x.n,it.n))).slice(0,3)]);CUR={it,rv:rv2};
  const barHTML=`<div class="row" style="margin:8px 0">${[["a","Describe, then name it"],["b","Name, then function"],["m","Mixed"]].map(([k,v])=>`<button class="${FD==k?"on":""}" onclick="FD='${k}';func()">${v}</button>`).join("")}<span style="width:10px"></span>${[["b","Brain parts"],["c","Chemicals"],["m","Both"]].map(([k,v])=>`<button class="${FK==k?"on":""}" onclick="FK='${k}';func()">${v}</button>`).join("")}</div>`;
  $("main").innerHTML=`<div class="mu">Question ${i+1} of ${Q.length}</div>${barHTML}<div class="card">${rv2?`<b>${it.n}</b>: what does it do?`:`Which ${it.g=="b"?"brain part":"chemical"} does this describe?<br><i>${it.f}</i>`}</div>${o.map(x=>`<button class="opt" onclick="fa(this,${x==it})">${rv2?x.f:x.n}</button>`).join("")}<div id="f"></div>`;
}

function fa(b,ok){
  document.querySelectorAll(".opt").forEach(x=>x.disabled=true);
  const it=CUR.it;
  b.classList.add(ok?"ok":"bad");
  if(ok)sc++;else{miss.add(it.n);document.querySelectorAll(".opt").forEach(x=>{if(x.textContent==(CUR.rv?it.f:it.n))x.classList.add("ok")})}
  $("f").innerHTML=`<div class="card"><b>${it.n}</b>: ${it.f}${it.x}</div><button id="nx" onclick="i++;fq()">Next</button>`;$("nx").focus();
}

const AQ={
  "Dopamine":["A video game win gives you a burst of reward and the urge to play again.","Cocaine blocks reuptake of this reward chemical, flooding the pleasure pathway.","Too much activity of this transmitter is linked to hallucinations in schizophrenia.","A Parkinson's patient with tremors and slow movement lacks this neurotransmitter."],
  "Serotonin":["An SSRI antidepressant keeps more of this mood transmitter in the synapse.","Low levels of this transmitter are tied to depression and poor sleep.","LSD causes hallucinations mainly by acting on this transmitter's receptors."],
  "Acetylcholine (ACh)":["Curare paralyzes prey by blocking this muscle transmitter.","Alzheimer's destroys neurons that use this memory transmitter.","Your quad contracts when this is released at the neuromuscular junction."],
  "GABA":["Anti-anxiety drugs and alcohol calm you by boosting this inhibitory transmitter.","Seizures can occur when too little of this brake-pedal chemical quiets firing."],
  "Glutamate":["Strengthening synapses through long-term potentiation relies on this excitatory transmitter.","Too much of this chemical can cause overexcitation, migraines, and seizures."],
  "Hippocampus":["After surgery a patient cannot form new conscious memories of events.","Taxi drivers learning city streets show growth in this memory region."],
  "Amygdala":["Seeing a snake triggers instant fear via these almond-shaped clusters.","Limbic structure tied to fear and aggression."],
  "Cerebellum":["A drunk person cannot walk a straight line; alcohol impairs this structure.","Coordinates voluntary movement and balance."],
  "Thalamus":["Messages from eyes and ears are routed to the cortex through this switchboard.","Smell is the only sense that bypasses this structure."],
  "Broca's area":["After a stroke, a patient understands you but speaks in slow, effortful, broken sentences."],
  "Wernicke's area":["A patient speaks fluently but the words make no sense and cannot understand others."]
};
const EX={"Acetylcholine (ACh)":["Glutamate"],"Glutamate":["Acetylcholine (ACh)"],"Frontal lobes":["Broca's area","Motor cortex"],"Broca's area":["Frontal lobes","Motor cortex"],"Temporal lobes":["Wernicke's area"],"Wernicke's area":["Temporal lobes"],"Hypothalamus":["Pituitary gland"],"Pituitary gland":["Hypothalamus"]};

function app(){
  Q=sh(Object.entries(AQ).filter(([t])=>{const d=D.find(x=>x[0]==t);return cats.has(d[1])&&(!miss_only||miss.has(t))}).flatMap(([t,a])=>a.map(q=>[q,t])));
  if(scope=="rand")Q=Q.slice(0,10);
  i=0;sc=0;ap();
}

function ap(){
  if(i>=Q.length)return done();
  const[q,t]=Q[i],d=D.find(x=>x[0]==t);
  const o=sh([d,...sh(D.filter(x=>x!=d&&x[1]==d[1]&&!(EX[t]||[]).includes(x[0]))).slice(0,3)]);
  $("main").innerHTML=`<div class="mu">Application question ${i+1} of ${Q.length}. Which term fits?</div><div class="card">${q}</div>${o.map(x=>`<button class="opt" onclick="pa(this,${x==d})">${x[0]}</button>`).join("")}<div id="f"></div>`;
}

function pa(b,ok){
  document.querySelectorAll(".opt").forEach(x=>x.disabled=true);
  const t=Q[i][1],d=D.find(x=>x[0]==t);
  b.classList.add(ok?"ok":"bad");
  if(ok)sc++;else{miss.add(t);document.querySelectorAll(".opt").forEach(x=>{if(x.textContent==t)x.classList.add("ok")})}
  $("f").innerHTML=`<div class="card">Answer: <b>${t}</b>. ${d[2]}${det(d)}</div><button onclick="i++;ap()">Next</button>`;
}

/* 8. AAQ Practice (Article Analysis Questions) */
const AP5=["Identify the research method used in this study.","State the operational definition of the dependent variable.","Explain what the data reveals about the participants.","Identify an ethical guideline applied in the study.","Explain a limitation regarding generalizability.","Use specific numerical evidence to support or refute the hypothesis."];
const AAQS=[{
  t:"Study 1: Exercise and Pain Tolerance",
  s:"Researchers asked whether a single bout of vigorous exercise changes how much pain people can tolerate. Sixty college students were randomly assigned to run on a treadmill for 30 minutes or to sit quietly for 30 minutes. Immediately afterward, each participant placed a hand in ice water and kept it there as long as possible. Participants gave informed consent and could remove their hand at any time. Hypothesis: People who exercise will tolerate pain longer than people who sit quietly.",
  r:"Group    | n  | Mean time in ice water (s)\nExercise | 30 | 94\nSitting  | 30 | 71\nDifference is significant, p < .05",
  m:["Experiment: manipulated exercise vs. sitting and used random assignment.","Pain tolerance, operationally defined as seconds keeping a hand in ice water.","Exercise group tolerated ice water 23 seconds longer on average (94 s vs. 71 s).","Informed consent and right to withdraw without penalty.","College student sample at one site may not generalize to older adults.","Supports hypothesis: exercise group kept hand in water 94 s vs 71 s (p < .05)."]
}];

let AI=0,AT=null;
function aaq(){
  const a=AAQS[AI];clearInterval(AT);
  $("main").innerHTML=`<div class="row" style="margin:0 0 8px">
    <button class="on">Study 1</button>
    <button onclick="aT()"><i class="fa-solid fa-clock"></i> <span id="tm">Start 25:00 timer</span></button>
  </div>
  <div class="card"><h3 class="ch">${a.t}</h3><p>${a.s}</p><pre class="rs">${a.r}</pre></div>
  ${"ABCDEF".split("").map((l,k)=>`<div class="card"><b>${l}.${AP5[k]}</b> <span class="tag">${k==5?"2 pts":"1 pt"}</span><textarea id="q${k}" rows="3" placeholder="Write your response in complete sentences..."></textarea><div id="m${k}"></div></div>`).join("")}
  <div class="row"><button class="on" onclick="aShow()">Show Model Answers</button></div>`;
}

function aT(){
  clearInterval(AT);let t=1500;
  AT=setInterval(()=>{
    t--;const e=$("tm");if(!e){clearInterval(AT);return}
    e.textContent=Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
    if(t<=0){clearInterval(AT);e.textContent="Time is up"}
  },1000);
}

function aShow(){
  AAQS[AI].m.forEach((m,k)=>{
    $("m"+k).innerHTML=`<div class="pill"><b>Model answer:</b> ${m}</div>`;
  });
}

window.onload=go;

new MutationObserver(()=>{
  const f=$("main").firstElementChild;
  if(f&&f.classList.contains("mu")&&!f.querySelector(".pg")&&Q.length&&!["gloss","browse","brain","neuron","methods","aaq"].includes(mode)){
    f.insertAdjacentHTML("beforeend",`<div class="pg"><i style="width:${Math.min(100,i/Q.length*100)}%"></i></div>`);
  }
}).observe($("main"),{childList:true});
</script>
