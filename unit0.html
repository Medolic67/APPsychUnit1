<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<title>Unit 0: Foundations of Psychological Science</title>
<style>
:root{--bg:#050f26;--p:#0b1f4a;--p2:#16408f;--ln:#1f4a9c;--ac:#4da3ff;--mu:#9fbdf0;--ok:#3ecf8e;--no:#ff6b81}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:radial-gradient(circle at 15% 10%,rgba(77,163,255,.14),transparent 40%),radial-gradient(circle at 85% 90%,rgba(40,100,230,.16),transparent 40%) fixed,var(--bg);color:#e6eeff;min-height:100vh}
header{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(11,31,74,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.hl{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:12px;background:rgba(77,163,255,.18);border:1px solid var(--ac);display:grid;place-items:center;color:var(--ac);font-size:20px;box-shadow:0 0 16px rgba(77,163,255,.4);cursor:pointer}
h1{font:800 20px 'Plus Jakarta Sans';margin:0;display:flex;align-items:center;gap:8px}
.unit-select{background:rgba(5,15,38,.8);color:var(--ac);border:1px solid var(--ac);padding:4px 8px;border-radius:8px;font:700 13px 'Plus Jakarta Sans';cursor:pointer;outline:none}
.unit-select:focus{box-shadow:0 0 0 2px var(--ac)}
.stats{display:flex;gap:16px;font:500 13px 'JetBrains Mono',monospace;background:rgba(5,15,38,.7);padding:8px 14px;border-radius:12px;border:1px solid var(--ln)}
nav{display:flex;flex-direction:row;flex-wrap:wrap;gap:4px;padding:5px;background:rgba(5,15,38,.6);border:1px solid var(--ln);border-radius:12px;width:auto}
nav .tab{width:auto;border:0;background:none;color:var(--mu);font:600 13px 'Plus Jakarta Sans';padding:8px 12px;border-radius:99px;cursor:pointer}
nav .tab:hover{color:#fff}
nav .tab.on{background:var(--ac);color:#04122a;box-shadow:0 0 14px rgba(77,163,255,.5)}
#rt{max-width:1100px;margin:0 auto;padding:10px}
main{max-width:960px;margin:0 auto;padding-bottom:60px}
.card{background:linear-gradient(160deg,rgba(22,64,143,.35),rgba(11,31,74,.9));border:1px solid var(--ln);border-radius:16px;padding:22px;margin:12px 0;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.fc{min-height:260px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;text-align:center;font-size:20px;background:linear-gradient(145deg,#1553b8,#0b1f4a);box-shadow:0 0 30px rgba(77,163,255,.25)}
.fc .t{font-size:26px;font-weight:700}.mu{color:var(--mu);font-size:14px}
button{background:var(--p);color:#fff;border:1px solid var(--ln);border-radius:8px;padding:8px 14px;cursor:pointer;font-family:inherit}
button:hover{background:var(--p2)}
button.on{background:var(--ac);color:#04122a;font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:7px 0;border-radius:12px;padding:12px 16px;transition:transform .1s}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--ac)}
.ok{background:#12503a!important;border-color:var(--ok)}
.bad{background:#5a1c2c!important;border-color:var(--no)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0}
.tag{font:12px system-ui;color:var(--ac);padding:2px 8px;border-radius:99px;background:rgba(77,163,255,.15);border:1px solid var(--ln);display:inline-block;margin-bottom:8px}
#flt summary{cursor:pointer;font-weight:600}
input[type=text]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:#fff;margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="hl">
    <div class="logo" onclick="switchUnit(document.getElementById('unitSel').value)"><i class="fa-solid fa-flask"></i></div>
    <div>
      <h1>NeuroMaster 
        <select id="unitSel" class="unit-select" onchange="switchUnit(this.value)">
<option value="index">Home: All Units</option>
          <option value="unit0" selected>Unit 0: Foundations of Psych Science</option>
          <option value="unit1">Unit 1: Biological Bases of Behavior</option>
          <option value="unit2" disabled>Unit 2: Cognition (Locked)</option>
          <option value="unit3" disabled>Unit 3: Development & Learning (Locked)</option>
          <option value="unit4" disabled>Unit 4: Social Psych & Personality (Locked)</option>
          <option value="unit5" disabled>Unit 5: Mental & Physical Health (Locked)</option>
        </select>
      </h1>
      <div class="mu">AP Psychology Study Suite</div>
    </div>
  </div>
  <div class="stats" id="cnt"></div>
  <nav id="modes"></nav>
</header>

<div id="rt">
  <details open class="card" id="flt">
    <summary><i class="fa-solid fa-sliders"></i> Scope & Filters</summary>
    <div class="bar" id="scope"></div>
    <div class="bar" id="cats"></div>
  </details>
  <main id="main"></main>
</div>

<script>
function switchUnit(val){
  if(val==='index'){
    window.location.href='index.html';
  } else if(val==='unit1'){
    window.location.href='unit1.html';
  } else if(val==='unit0'){
    window.location.href='unit0.html';
  }
}

const C={
  S:"Scientific Attitude & Thinking",
  M:"Research Methods & Sampling",
  E:"Experimental Variables & Controls",
  T:"Statistics & Data Analysis",
  X:"Ethics in Research"
};

const D=[
  ["Critical thinking","S","Thinking that does not automatically accept arguments and conclusions, but rather examines assumptions, appraises sources, discerns hidden biases, evaluates evidence, and assesses conclusions."],
  ["Hindsight bias","S","The tendency to believe, after learning an outcome, that one would have foreseen it (also known as the 'I-knew-it-all-along' phenomenon)."],
  ["Peer reviewers","S","Scientific experts who anonymously evaluate the quality, validity, and methodology of research before it is published in a professional journal."],
  ["Theory","S","An explanation using an integrated set of principles that organizes observations and predicts behaviors or events."],
  ["Hypothesis","S","A testable prediction, often implied by a theory, that specifies relationships between variables."],
  ["Falsifiable","S","The logical possibility that an assertion, hypothesis, or theory can be shown to be false by an observation or experiment."],
  ["Operational definition","S","A carefully worded statement of the exact procedures or operations used in a research study to measure or manipulate a variable."],
  ["Replication","S","Repeating the essence of a research study, usually with different participants in different situations, to see whether the basic finding extends to other participants."],
  ["Case study","M","A descriptive technique in which one individual or group is studied in depth in the hope of revealing universal principles."],
  ["Naturalistic observation","M","A descriptive technique of observing and recording behavior in naturally occurring situations without trying to manipulate or control the situation."],
  ["Survey","M","A descriptive technique for obtaining the self-reported attitudes or behaviors of a particular group, usually by questioning a representative, random sample."],
  ["Social desirability bias","M","The tendency of survey respondents to answer questions in a manner that will be viewed favorably by others."],
  ["Self-report bias","M","A type of response bias where participants provide inaccurate or embellished reports of their own thoughts, feelings, or behaviors."],
  ["Sampling bias","M","A flawed sampling process that produces an unrepresentative sample."],
  ["Random sample","M","A sample that fairly represents a population because each member has an equal chance of inclusion."],
  ["Population","M","All the individuals in a group being studied, from which samples may be drawn."],
  ["Correlation","M","A measure of the extent to which two variables allow for mutual prediction, indicating how well either variable predicts the other."],
  ["Correlation coefficient","M","A statistical index of the relationship between two variables, ranging from -1.00 to +1.00."],
  ["Variable","M","Anything that can vary and is feasible and ethical to measure in an experiment or study."],
  ["Scatterplot","M","A graphed cluster of dots, each representing the values of two variables. The slope suggests the direction, and the amount of scatter suggests the strength of correlation."],
  ["Regression toward the mean","M","The tendency for extreme or unusual scores or events to fall back toward their average."],
  ["Experiment","E","A research method in which an investigator manipulates one or more independent variables to observe the effect on a dependent variable while controlling confounding variables."],
  ["Experimental group","E","In an experiment, the group exposed to the treatment, that is, to one version of the independent variable."],
  ["Control group","E","In an experiment, the group not exposed to the treatment; serves as a comparison for evaluating the effect of the treatment."],
  ["Random assignment","E","Assigning participants to experimental and control groups by chance, minimizing preexisting differences between groups."],
  ["Single-blind procedure","E","An experimental procedure in which the research participants are ignorant (blind) about whether they have received the treatment or a placebo."],
  ["Double-blind procedure","E","An experimental procedure in which both the research participants and the research staff are ignorant (blind) about treatment or placebo delivery."],
  ["Placebo effect","E","Experimental results caused by expectations alone; any effect on behavior caused by the administration of an inactive substance/condition."],
  ["Independent variable","E","In an experiment, the factor that is manipulated; the variable whose effect is being studied."],
  ["Confounding variable","E","A factor other than the factor being studied that might influence a study's results."],
  ["Experimenter bias","E","A researcher's expectations or preferences influencing the outcome of a study or interpretation of data."],
  ["Dependent variable","E","In an experiment, the outcome factor; the variable that may change in response to manipulations of the independent variable."],
  ["Validity","E","The extent to which a test or experiment measures or predicts what it is supposed to."],
  ["Quantitative research","T","Research that collects and analyzes numerical data to identify patterns, make predictions, or test relationships."],
  ["Qualitative research","T","Research that collects non-numerical data (such as narrative text, transcripts, or open observations) to understand concepts, opinions, or experiences."],
  ["Informed consent","X","An ethical principle that research participants be told enough to enable them to choose whether they wish to participate."],
  ["Debriefing","X","The post-experimental explanation of a study, including its purpose and any deceptions, to its participants."],
  ["Descriptive statistics","T","Numerical data used to measure and describe characteristics of groups. Includes measures of central tendency and variation."],
  ["Mode","T","The most frequently occurring score(s) in a distribution."],
  ["Mean","T","The arithmetic average of a distribution, obtained by adding the scores and then dividing by the number of scores."],
  ["Median","T","The middle score in a distribution; half the scores are above it and half are below it."],
  ["Percentile rank","T","The percentage of scores in a frequency distribution that are equal to or lower than a given score."],
  ["Skewed distribution","T","A representation of scores that lacks symmetry around their average value (can be positively or negatively skewed)."],
  ["Range","T","The difference between the highest and lowest scores in a distribution."],
  ["Standard deviation","T","A computed measure of how much scores vary around the mean score."],
  ["Normal curve","T","A symmetrical, bell-shaped curve that describes the distribution of many types of data; most scores fall near the mean."],
  ["Inferential statistics","T","Numerical data that allow one to generalize—to infer from sample data the probability of something being true of a population."],
  ["Meta-analysis","M","A statistical procedure for combining the results of many different research studies to find an overall effect."],
  ["Statistical significance","T","A statistical statement of how likely it is that an obtained result occurred by chance (typically p < .05)."],
  ["Effect size","T","A quantitative measure of the magnitude or strength of an experimental phenomenon or relationship."]
];

const $=id=>document.getElementById(id);
const sh=a=>{a=[...a];for(let i=a.length;i>1;){let j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};

let mode="flash",scope="all",cats=new Set(Object.keys(C)),miss=new Set(),miss_only=false;
const MODES={gloss:"Glossary",flash:"Flashcards",quiz:"Quiz",match:"Matching",type:"Type-In"};
const IC={gloss:"book-open",flash:"clone",quiz:"list-check",match:"puzzle-piece",type:"keyboard"};

function pool(n){let p=sh(D.filter(d=>cats.has(d[1])&&(!miss_only||miss.has(d[0]))));return scope=="rand"?p.slice(0,n):p}

function bar(){
  $("modes").innerHTML=Object.keys(MODES).map(k=>`<button class="tab ${k==mode?"on":""}" onclick="mode='${k}';go()"><i class="fa-solid fa-${IC[k]}"></i> ${MODES[k]}</button>`).join("");
  $("scope").innerHTML=[["rand","Random 10"],["all","All Terms"]].map(([k,v])=>`<button class="${k==scope?"on":""}" onclick="scope='${k}';go()">${v}</button>`).join("")+`<button class="${miss_only?"on":""}" onclick="miss_only=!miss_only;go()">Missed (${miss.size})</button>`;
  $("cats").innerHTML=`<button onclick="cats=new Set(Object.keys(C));go()">All Categories</button>`+Object.entries(C).map(([k,v])=>`<button class="${cats.has(k)?"on":""}" onclick="tog('${k}')">${v}</button>`).join("");
  $("cnt").innerHTML=`<span><i class="fa-solid fa-circle-check" style="color:#3ecf8e"></i> Terms: ${D.filter(d=>cats.has(d[1])).length}</span><span><i class="fa-solid fa-triangle-exclamation" style="color:#ffb454"></i> Missed: ${miss.size}</span>`;
}

function tog(k){cats.has(k)?cats.delete(k):cats.add(k);if(!cats.size)cats.add(k);go()}

let Q=[],i=0,sc=0,flip=false;

function go(){
  bar();
  Q=pool(mode=="match"?6:10);
  i=0;sc=0;flip=false;
  if(!Q.length&&mode!=="gloss"){
    $("main").innerHTML='<div class="card">No terms match your selection criteria. Clear filters to continue.</div>';
    return;
  }
  ({gloss,flash,quiz,match,type:typ})[mode]();
}

function done(){
  $("main").innerHTML=`<div class="card"><h2>Session Completed!</h2><p>Score: ${sc} / ${Q.length}</p><button onclick="go()">Restart</button></div>`;
}

function gloss(){
  $("main").innerHTML='<input type="text" id="q" placeholder="Search Unit 0 terms or definitions..." oninput="gl()"><div id="gl"></div>';
  gl();
}

function gl(){
  const s=($("q").value||"").toLowerCase();
  $("gl").innerHTML=D.filter(d=>cats.has(d[1])&&(d[0]+d[2]).toLowerCase().includes(s)).map(d=>`<div class="card"><div><span class="tag">${C[d[1]]}</span></div><b>${d[0]}</b><div>${d[2]}</div></div>`).join("");
}

let rv=false;
function flash(){
  if(i>=Q.length)return done();
  const d=Q[i];
  $("main").innerHTML=`<div class="mu">Card ${i+1} of ${Q.length}. Click card to flip.</div>
  <div class="card fc" onclick="flip=!flip;flash()" tabindex="0">${flip!=rv?`<div>${d[2]}</div>`:`<div class="t">${d[0]}</div><div class="tag">${C[d[1]]}</div>`}</div>
  <div class="row">
    <button onclick="i=Math.max(0,i-1);flip=false;flash()">Back</button>
    <button onclick="miss.add('${d[0].replace(/'/g,"\\'")}');bar();i++;flip=false;flash()">Still Learning</button>
    <button onclick="miss.delete('${d[0].replace(/'/g,"\\'")}');bar();sc++;i++;flip=false;flash()">Mastered</button>
    <button onclick="rv=!rv;flip=false;flash()">Flip side: ${rv?"definition first":"term first"}</button>
  </div>`;
}

function quiz(){
  if(i>=Q.length)return done();
  const d=Q[i];
  const o=sh([d,...sh(D.filter(x=>x!=d&&(x[1]==d[1]||Math.random()<.4))).slice(0,3)]);
  $("main").innerHTML=`<div class="mu">Question ${i+1} of ${Q.length}</div>
  <div class="card"><span class="tag">${C[d[1]]}</span><div>${d[2]}</div></div>
  <div id="o">${o.map(x=>`<button class="opt" onclick="pick(this,${x==d})">${x[0]}</button>`).join("")}</div>
  <div id="f"></div>`;
}

function pick(b,ok){
  document.querySelectorAll(".opt").forEach(x=>x.disabled=true);
  const d=Q[i];
  b.classList.add(ok?"ok":"bad");
  if(ok) sc++; else {
    miss.add(d[0]);
    document.querySelectorAll(".opt").forEach(x=>{if(x.textContent==d[0])x.classList.add("ok")});
  }
  $("f").innerHTML=`<div class="card"><b>${d[0]}:</b> ${d[2]}</div><button onclick="i++;quiz()">Next Question</button>`;
}

let M={t:[],d:[],s:null,left:0};
function match(){
  const r=Q.slice(i,i+6);
  if(!r.length)return done();
  M={t:sh(r),d:sh(r),s:null,left:r.length};
  drawM();
}

function drawM(){
  $("main").innerHTML=`<div class="mu">Match terms with definitions. ${M.left} remaining.</div>
  <div class="grid">
    <div>${M.t.map(x=>`<button class="opt ${M.s&&M.s.type=='t'&&M.s.val==x?'on':''}" onclick="selM('t', '${x[0].replace(/'/g,"\\'")}')">${x[0]}</button>`).join("")}</div>
    <div>${M.d.map(x=>`<button class="opt ${M.s&&M.s.type=='d'&&M.s.val==x?'on':''}" onclick="selM('d', '${x[0].replace(/'/g,"\\'")}')">${x[2]}</button>`).join("")}</div>
  </div>`;
}

function selM(type, valStr){
  const obj = D.find(x=>x[0]===valStr);
  if(!M.s){
    M.s={type, val:obj};
    drawM();
  } else if(M.s.type===type){
    M.s={type, val:obj};
    drawM();
  } else {
    if(M.s.val[0]===obj[0]){
      sc++;
      M.t=M.t.filter(x=>x[0]!==obj[0]);
      M.d=M.d.filter(x=>x[0]!==obj[0]);
      M.left--;
      M.s=null;
      if(M.left===0) i+=6;
      if(i>=Q.length) done(); else drawM();
    } else {
      miss.add(obj[0]);
      bar();
      alert("Incorrect match! Try again.");
      M.s=null;
      drawM();
    }
  }
}

function typ(){
  if(i>=Q.length)return done();
  const d=Q[i];
  $("main").innerHTML=`<div class="mu">Term ${i+1} of ${Q.length}</div>
  <div class="card"><span class="tag">${C[d[1]]}</span><div>${d[2]}</div></div>
  <input type="text" id="ans" placeholder="Type the term here..." onkeydown="if(event.key==='Enter')chkT()">
  <button onclick="chkT()">Submit</button>
  <div id="f"></div>`;
}

function chkT(){
  const input=$("ans").value.trim().toLowerCase();
  const d=Q[i];
  const target=d[0].toLowerCase();
  if(input===target){
    sc++;
    $("f").innerHTML=`<div class="card ok">Correct! <b>${d[0]}</b></div><button onclick="i++;typ()">Next</button>`;
  } else {
    miss.add(d[0]);
    bar();
    $("f").innerHTML=`<div class="card bad">Incorrect. The correct term is: <b>${d[0]}</b></div><button onclick="i++;typ()">Next</button>`;
  }
}

window.onload=go;
</script>
</body>
</html>
